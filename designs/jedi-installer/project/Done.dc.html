<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>安装器 · 安装完成</title>
<script src="./support.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#FFFFFF;font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wordmark{font-family:"Poppins","Segoe UI",sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
.rise{animation:rise .6s cubic-bezier(.16,1,.3,1) both}
.btn{transition:background .15s ease,transform .15s ease}
.btn:hover{background:#000000;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 440px; height: 600px; box-sizing: border-box; background: #FFFFFF; color: #111111; overflow: hidden; position: relative; border: 1px solid #ECECEE; border-radius: 10px">

  <div style="height: 32px; box-sizing: border-box; border-bottom: 1px solid #ECECEE; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px">
    <span style="font-size: 12px; color: #8A8A8E">Jedi 工具箱 安装程序</span>
    <span style="margin-left: auto; display: flex; align-items: center; gap: 20px; color: #B9B9BD">
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5h6" stroke="currentColor" stroke-width="1.2"/></svg>
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="2" y="2" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5" stroke="currentColor" stroke-width="1.2"/></svg>
    </span>
  </div>

  <div style="position: relative; height: 568px; text-align: center">

    <img class="rise" src="/_blob/f53dafde2f8cbc026b10dfa5213b3f84" alt="Jedi 应用图标" style="position: absolute; left: calc(50% - 70px); top: 56px; width: 140px; height: 140px; display: block">

    <div class="rise wordmark" style="position: absolute; left: 0; right: 0; top: 212px; font-size: 30px; font-weight: 600; letter-spacing: .5px; line-height: 1; color: #111111; animation-delay: .08s">Jedi</div>
    <div class="rise" style="position: absolute; left: 0; right: 0; top: 254px; font-size: 9px; letter-spacing: 2.8px; color: #A5A5AA; text-transform: uppercase; animation-delay: .14s">Your Local AI Agent</div>

    <div class="rise" style="position: absolute; left: 0; right: 0; top: 312px; animation-delay: .2s">
      <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="21" fill="none" stroke="#111111" stroke-width="1.5" opacity=".85"/><path d="M14 24l6.5 6.5L32 16.5" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="28" stroke-dashoffset="28" style="animation: draw .5s .5s cubic-bezier(.16,1,.3,1) forwards"/></svg>
      <h1 style="margin: 16px 0 0; font-size: 21px; font-weight: 700; color: #111111">安装完成</h1>
      <div style="margin-top: 10px; font-size: 13px; color: #8A8A8E">Jedi 工具箱已就绪</div>
    </div>

    <button type="button" class="btn rise" style="position: absolute; left: 52px; top: 486px; width: 336px; height: 46px; border: 0; border-radius: 6px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: 2px; cursor: pointer; animation-delay: .28s">启动 Jedi 工具箱</button>
    <button type="button" class="btn rise" style="position: absolute; left: 0; right: 0; top: 542px; border: 0; background: transparent; color: #9A9A9E; font-family: inherit; font-size: 12px; cursor: pointer; animation-delay: .34s">完成 · 已创建开始菜单与桌面快捷方式</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#111111"},"$preview":{"width":440,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#111111' };
}
}
</script>
</body>
</html>
