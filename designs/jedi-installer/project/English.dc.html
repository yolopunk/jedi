<style>
body{margin:0;background:#FFFFFF;font-family:"Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
h1,.headline,.wordmark{font-family:"Poppins","Segoe UI",sans-serif}
input[type=checkbox]{accent-color:#111111}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.16,1,.3,1) both}
.btn{transition:background .15s ease,transform .15s ease}
.btn:hover{background:#000000;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
a.chg{color:#111111;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#D6D6DA;transition:text-decoration-color .15s ease}
a.chg:hover{text-decoration-color:#111111}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 440px; height: 600px; box-sizing: border-box; background: #FFFFFF; color: #111111; overflow: hidden; position: relative; border: 1px solid #ECECEE; border-radius: 10px">

    <img class="rise" src="/_blob/f53dafde2f8cbc026b10dfa5213b3f84" alt="Jedi app icon" style="position: absolute; left: calc(50% - 70px); top: 56px; width: 140px; height: 140px; display: block">

    <div class="rise wordmark headline" style="position: absolute; left: 0; right: 0; top: 212px; font-size: 30px; font-weight: 600; letter-spacing: .5px; line-height: 1; color: #111111; animation-delay: .08s">Jedi</div>

      Install location&nbsp;&nbsp;D:\softwares\Jedi&nbsp;&nbsp;·&nbsp;&nbsp;<a href="#" class="chg">Change</a>

    <div class="rise" style="position: absolute; left: 0; right: 0; top: 340px; animation-delay: .26s">
      <label style="display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: #1A1A1A; cursor: pointer">
        <input type="checkbox" checked style="width: 15px; height: 15px; margin: 0">

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#111111"},"$preview":{"width":440,"height":600}}'>
