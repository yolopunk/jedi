<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OPML 导入结果反馈</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#539bf5}a:hover{color:#6eb1ff}
</style>
</helmet>
<div style="width: 920px; height: 720px; box-sizing: border-box; background: #14151b; font-family: 'Noto Sans SC', sans-serif; color: #f4f4f5; display: flex; align-items: center; justify-content: center; padding: 48px;">
  <div style="width: 620px; background: #111113; border: 1px solid #27272a; border-radius: 20px; box-shadow: 0 28px 80px rgba(0,0,0,0.55); overflow: hidden; position: relative;">
    <div style="position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #539bf5, transparent); opacity: 0.6;"></div>

    <!-- 标题栏 -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #27272a;">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 1px;">导入结果</span>
      <button aria-label="关闭" style="background: none; border: none; color: rgba(244,244,245,0.5); cursor: pointer; font-size: 14px; padding: 4px 8px;">✕</button>
    </div>

    <!-- 成功摘要 -->
    <div style="padding: 20px 20px 0; display: flex; align-items: center; gap: 14px;">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(63,185,80,0.12); border: 1px solid rgba(63,185,80,0.35); display: grid; place-items: center; flex-shrink: 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 16px; font-weight: 600;">成功导入 10 个订阅</span>
        <span style="font-size: 12px; color: #a1a1aa;">其中 2 个没有暴露 RSS，需要手动补齐（点条目直接跳粘贴入口）</span>
      </div>
    </div>

    <!-- 失败列表 -->
    <div style="margin: 16px 20px 0; padding: 4px 0; background: #18181b; border: 1px solid #27272a; border-radius: 12px; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #27272a;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f85149" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span style="font-size: 13px; font-weight: 500;">大内密谈</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #92929e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">xiaoyuzhoufm.com/podcast/5e3bdf…</span>
        <span style="flex: 1;"></span>
        <button style="min-height: 30px; padding: 0 12px; font-family: inherit; font-size: 12px; font-weight: 500; color: #539bf5; background: rgba(83,155,245,0.1); border: 1px solid rgba(83,155,245,0.35); border-radius: 6px; cursor: pointer; flex-shrink: 0;">手动添加</button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f85149" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span style="font-size: 13px; font-weight: 500;">播客 D</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #92929e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">example.com/feed（HTTP 403）</span>
        <span style="flex: 1;"></span>
        <button style="min-height: 30px; padding: 0 12px; font-family: inherit; font-size: 12px; font-weight: 500; color: #539bf5; background: rgba(83,155,245,0.1); border: 1px solid rgba(83,155,245,0.35); border-radius: 6px; cursor: pointer; flex-shrink: 0;">重试</button>
      </div>
    </div>

    <!-- 提示条 -->
    <div style="margin: 14px 20px 0; padding: 12px 14px; background: rgba(210,153,34,0.08); border: 1px solid rgba(210,153,34,0.3); border-radius: 10px; display: flex; gap: 10px; align-items: flex-start;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d29922" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <span style="font-size: 12px; line-height: 1.8; color: #a1a1aa;">小宇宙独家节目不暴露 RSS 时，可去节目官网 / 目录站（如 NeoDB）查官方 feed 后粘贴订阅；403 多为 UA 被拦，重试会带浏览器 UA 再请求。</span>
    </div>

    <!-- 操作按钮 -->
    <div style="display: flex; justify-content: flex-end; gap: 10px; padding: 16px 20px 20px;">
      <button style="min-height: 36px; padding: 0 16px; font-family: inherit; font-size: 13px; font-weight: 500; color: #a1a1aa; background: #18181b; border: 1px solid #27272a; border-radius: 8px; cursor: pointer;">稍后再说</button>
      <button style="min-height: 36px; padding: 0 20px; font-family: inherit; font-size: 13px; font-weight: 500; color: #09090b; background: #539bf5; border: 1px solid #539bf5; border-radius: 8px; cursor: pointer;">去粘贴 RSS</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":920,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
