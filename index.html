<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="icon" href="/favicon.ico?v=jedi-koala-20261003" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png?v=jedi-koala-20261003" sizes="32x32" />
    <style>
      /* 首屏关键样式：Vue 挂载前即是启动页底色，消除刷新时的白屏等待。
         配色与 SplashScreen.vue 保持一致（启动页恒为暗色开机画面）。 */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0f;
        overflow: hidden;
      }

      #app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
      }

      #app-boot img {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        border: 1px solid rgb(255 255 255 / 0.14);
      }

      #app-boot .boot-title {
        margin: 14px 0 0;
        font-family: 'CangErJinKai', '苍耳今楷', 'Kaiti SC', 'STKaiti', 'KaiTi', ui-serif, serif;
        font-size: 22px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 6px;
        text-indent: 6px;
        color: #f4f4f5;
      }

      #app-boot .boot-bar {
        position: absolute;
        left: 50%;
        bottom: 12vh;
        width: 132px;
        height: 2px;
        border-radius: 1px;
        background: rgb(255 255 255 / 0.09);
        overflow: hidden;
        transform: translateX(-50%);
      }

      #app-boot .boot-bar::after {
        content: '';
        display: block;
        width: 36%;
        height: 100%;
        border-radius: 1px;
        background: rgb(255 255 255 / 0.5);
        animation: boot-slide 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(300%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-boot .boot-bar::after {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <!-- 静态启动画面：Vue 挂载时被整体替换，与 SplashScreen 无缝衔接 -->
      <div id="app-boot">
        <img src="/icon.png?v=jedi-koala-20261003" alt="" />
        <div class="boot-title">Jedi Command</div>
        <div class="boot-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
