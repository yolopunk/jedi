# Jedi Hosts 远程数据源 —— 集群内统一 API 适配器（纯 shell，无 python 依赖）
#
# 作用：把集群内全部 ingress 自定义域名，按 Jedi 定义的 JSON 分组格式统一返回：
#   [{"name":"<分组名>","hosts":[{"ip":"1.2.3.4","domain":"a.com","disabled":false}]}]
# Jedi 侧只需在「Hosts → 添加分组 → 远程 URL」填入该服务的 URL，即可订阅并自动同步，
# 不需要在本地/WSL 运行任何服务。
#
# 一次性部署（在能访问集群的环境执行，如 WSL 内）：
#   kubectl apply -f scripts/k8s-hosts-api.yaml
#
# 数据源 URL（<node-ip> 为任意节点 IP，NodePort 固定 30180）：
#   http://<node-ip>:30180/hosts.json?ip=<目标IP>&name=<分组名>&namespace=<ns>
#
# URL 参数（必要字段全部由 URL 携带，Jedi 无需其他配置）：
#   ip        统一指向的 IP（强制覆盖，k3s 的 Traefik 通常不上报 LB IP，一般必填，
#             如节点 IP / WSL IP / 公司入口 IP；缺省时用 Deployment 里的 DEFAULT_IP）
#   name      返回的分组名，默认 k8s-ingress
#   namespace 仅统计该命名空间，默认全集群
#
# 示例：
#   curl http://10.0.0.5:30180/hosts.json?ip=10.0.0.5
#   → [{"name":"k8s-ingress","hosts":[{"ip":"10.0.0.5","domain":"app.example.com","disabled":false}, ...]}]
#
# 实现说明：
# - 只有一个 ConfigMap 里的 handler.sh，用 busybox 的 nc/wget/awk/sed 实现 HTTP + JSON，
#   不依赖任何语言运行时，也不需要构建镜像
# - 权限只有 ingress 的 get/list（只读）；Pod 内用自身 ServiceAccount 直连 K8s API，
#   读不到 token 时（本机调试）自动退回调用 kubectl
# - 镜像借用 rancher/mirrored-library-nginx:1.27.2-alpine（集群里已有缓存，自带 nc 与
#   可用的 TLS wget）。本集群拉不到 Docker Hub、内网 registry 也没有 python/busybox 镜像，
#   所以用 nodeAffinity 限定在有该缓存的节点上；换成内网可达镜像后 affinity 可删掉
# - nc 是单连接串行处理：适配器只在打开 Hosts 页/手动刷新时被调用，够用；并发很高时
#   改成常驻进程或换镜像即可
# - 本机调试：`SA_DIR=/nonexistent sh handler.sh` 读 stdin 的 HTTP 请求即可，会走 kubectl
# - 卸载：kubectl delete -f scripts/k8s-hosts-api.yaml
#
# --- 只读 ServiceAccount + RBAC（仅 ingress 的 get/list） ---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: jedi-hosts-api
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jedi-hosts-api-ingress-reader
rules:
  - apiGroups: ["networking.k8s.io", "extensions"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jedi-hosts-api-ingress-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jedi-hosts-api-ingress-reader
subjects:
  - kind: ServiceAccount
    name: jedi-hosts-api
    namespace: default
---
# --- 适配器脚本（纯 shell，ConfigMap 挂载，无需构建镜像） ---

apiVersion: v1
kind: ConfigMap
metadata:
  name: jedi-hosts-api-script
  namespace: default
data:
  handler.sh: |
    #!/bin/sh
    # Jedi hosts 数据源适配器（纯 shell，无 python 依赖）
    # GET /hosts.json[?ip=<强制IP>][&name=<分组名>][&namespace=<命名空间>]
    # 参数：ip 强制覆盖所有条目的 IP；name 返回的分组名（默认 k8s-ingress）；
    #       namespace 只统计该命名空间（缺省为全集群）

    SA_DIR=${SA_DIR:-/var/run/secrets/kubernetes.io/serviceaccount}
    API=${API:-https://kubernetes.default.svc}
    DEFAULT_IP=${DEFAULT_IP:-}

    respond() {
      body=$2
      len=$(printf '%s' "$body" | wc -c)
      printf 'HTTP/1.1 %s\r\nContent-Type: application/json; charset=utf-8\r\nContent-Length: %s\r\nCache-Control: no-store\r\nConnection: close\r\n\r\n%s' "$1" "$len" "$body"
    }

    urldecode() {
      printf '%b' "$(printf '%s' "$1" | sed -e 's/+/ /g' -e 's/%\([0-9A-Fa-f][0-9A-Fa-f]\)/\\x\1/g')"
    }

    read -t 5 -r reqline || exit 0
    [ -z "$reqline" ] && exit 0
    target=$(printf '%s' "$reqline" | awk '{print $2}')
    echo "$(date '+%Y-%m-%d %H:%M:%S') ${target}" >&2

    # 吃掉请求头，读到空行为止（最多 40 行，避免异常连接把服务卡住）
    i=0
    while [ "$i" -lt 40 ]; do
      i=$((i + 1))
      read -t 5 -r hdr || break
      hdr=$(printf '%s' "$hdr" | tr -d '\r')
      [ -z "$hdr" ] && break
    done

    case "$target" in
      /hosts.json*|/) ;;
      *) respond "404 Not Found" '{"error":"not found"}'; exit 0 ;;
    esac

    IP=""
    NAME=k8s-ingress
    NS=""
    case "$target" in
      *\?*) qs=${target#*\?} ;;
      *) qs="" ;;
    esac

    if [ -n "$qs" ]; then
      for kv in $(printf '%s' "$qs" | tr '&' ' '); do
        k=${kv%%=*}
        [ "$k" = "$kv" ] && continue
        v=$(urldecode "${kv#*=}")
        case "$k" in
          ip) IP=$v ;;
          name) NAME=$v ;;
          namespace) NS=$v ;;
        esac
      done
    fi

    [ -z "$IP" ] && IP=$DEFAULT_IP

    path=/apis/networking.k8s.io/v1/ingresses
    [ -n "$NS" ] && path=/apis/networking.k8s.io/v1/namespaces/$NS/ingresses

    token=""
    [ -r "$SA_DIR/token" ] && token=$(cat "$SA_DIR/token")

    if [ -n "$token" ]; then
      raw=$(wget -q -O - --no-check-certificate --header="Authorization: Bearer $token" "$API$path" 2>/dev/null)
    else
      if [ -n "$NS" ]; then
        raw=$(kubectl get ingress -n "$NS" -o json 2>/dev/null)
      else
        raw=$(kubectl get ingress -A -o json 2>/dev/null)
      fi
    fi

    if [ -z "$raw" ]; then
      respond "502 Bad Gateway" '{"error":"query k8s api failed"}'
      exit 0
    fi

    domains=$(printf '%s' "$raw" \
      | grep -o '"host" *: *"[^"]*"' \
      | sed 's/^.*: *"//; s/"$//' \
      | tr 'A-Z' 'a-z' \
      | grep -v '^\*' \
      | grep -v '^[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*$' \
      | sort -u)

    if [ -z "$domains" ]; then
      respond "200 OK" '[]'
      exit 0
    fi

    entries=$(printf '%s\n' "$domains" | awk -v ip="$IP" 'BEGIN { ORS = "" } { if (NR > 1) printf ","; printf "{\"ip\":\"%s\",\"domain\":\"%s\",\"disabled\":false}", ip, $0 }')
    safe_name=$(printf '%s' "$NAME" | tr -d '"\\')
    respond "200 OK" "$(printf '[{"name":"%s","hosts":[%s]}]' "$safe_name" "$entries")"
---
# --- 适配器 Deployment ---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: jedi-hosts-api
  namespace: default
  labels:
    app: jedi-hosts-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jedi-hosts-api
  template:
    metadata:
      labels:
        app: jedi-hosts-api
    spec:
      serviceAccountName: jedi-hosts-api
      # 只在已有该镜像缓存的节点上调度（集群拉不到 docker.io）。等内网 registry 里
      # 有可达镜像后，把 image 换掉并删除下面整段 affinity
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["10-50-128-32", "10-50-128-34"]
      containers:
        - name: server
          image: rancher/mirrored-library-nginx:1.27.2-alpine
          imagePullPolicy: IfNotPresent
          # busybox nc 一次处理一个连接：accept 后 exec handler.sh，处理完再重新监听
          command: ["sh", "-c", "while :; do nc -l -p 18748 -e /app/handler.sh || sleep 1; done"]
          env:
            # URL 不带 ip 参数时的兜底指向；按需改成节点 IP / 入口 IP
            - name: DEFAULT_IP
              value: "10.50.128.32"
          ports:
            - containerPort: 18748
          readinessProbe:
            tcpSocket:
              port: 18748
            initialDelaySeconds: 3
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: jedi-hosts-api-script
            # ConfigMap 默认 0644，CGI 需要可执行位
            defaultMode: 0755
---
# --- 对外暴露（NodePort 30180） ---

apiVersion: v1
kind: Service
metadata:
  name: jedi-hosts-api
  namespace: default
  labels:
    app: jedi-hosts-api
spec:
  type: NodePort
  selector:
    app: jedi-hosts-api
  ports:
    - port: 18748
      targetPort: 18748
      nodePort: 30180
