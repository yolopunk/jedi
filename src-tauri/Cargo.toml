[package]
name = "Jedi"
version = "0.3.0"
description = "A multi-functional development toolkit to enhance productivity."
authors = ["yolo"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.8"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "tracing", "devtools"] }
tauri-plugin-fs = "2.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.34.2"
log = "0.4.20"
nvml-wrapper = "0.10.0"
time = { version = "=0.3.41", features = ["macros"] }
tracing = { version = "0.1.40" }
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "ansi", "time"] }
tracing-appender = "0.2.3"
tracing-error = "0.2.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
dirs = "6.0.0"
wallpaper = "3"
regex = "1"
url = "2.5"
rss = "2.0.12"
futures = "0.3.31"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
gray_matter = "0.3.2"
# AI Chat 安全依赖
rusqlite = { version = "0.31", features = ["bundled"] }
secrecy = { version = "0.8", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
